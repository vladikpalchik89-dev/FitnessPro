name: Build FITNESS PRO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project and merge code
        run: |
          # Backup our code
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          
          # Create fresh Flutter project
          flutter create --project-name fitness_pro --org com.fitnesspro --platforms android /tmp/fresh_project
          
          # Copy fresh android config
          cp -r /tmp/fresh_project/android android_fresh
          
          # Restore our lib and pubspec
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          
          # Replace android with fresh (v2 embedding)
          rm -rf android
          mv android_fresh android
          
          # Verify manifest has flutterEmbedding
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml
          
          ls -la

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
