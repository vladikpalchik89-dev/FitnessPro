name: Build FITNESS PRO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project and merge code
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --project-name fitness_pro --org com.fitnesspro --platforms android /tmp/fresh_project
          rm -rf /tmp/fresh_project/lib
          cp -r /tmp/lib_backup /tmp/fresh_project/lib
          cp /tmp/pubspec_backup.yaml /tmp/fresh_project/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/fresh_project/android/app/src/main/AndroidManifest.xml
          rm -rf *
          cp -r /tmp/fresh_project/* .
          cp -r /tmp/fresh_project/.[!.]* . 2>/dev/null || true
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml
          ls -la

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
